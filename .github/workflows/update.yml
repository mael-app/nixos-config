name: update

on:
  # Monday 06:00 UTC, the middle of the working day in Asia/Shanghai.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The pull request is pushed and opened as github-actions[bot], which needs
# both scopes. The repository must also allow Actions to create pull
# requests (Settings -> Actions -> General).
permissions:
  contents: write
  pull-requests: write

jobs:
  flake-lock:
    name: update the flake inputs
    runs-on: ubuntu-latest
    # Resolving nixos-unstable on the Chinese mirror from a US runner took
    # 58 minutes; the cap only stops a hung fetch from running for 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake update
        run: nix flake update

      # nixpkgs is fetched from a Chinese mirror (see flake.nix), and the lock
      # file trusts whatever commit the mirror called nixos-unstable. Git
      # checks that the files match that commit, but not that the commit is
      # upstream's: a compromised mirror could serve its own. Refuse the
      # update unless GitHub's nixos-unstable contains the locked commit.
      - name: verify the nixpkgs commit against GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          status=$(gh api "repos/NixOS/nixpkgs/compare/$rev...nixos-unstable" --jq .status)
          echo "nixpkgs $rev: $status relative to NixOS/nixpkgs nixos-unstable"
          case "$status" in
            identical|ahead) ;;
            *) echo "::error::$rev is not on NixOS/nixpkgs nixos-unstable"; exit 1 ;;
          esac

      # A pull request opened with GITHUB_TOKEN does not start another
      # workflow, so check.yml would never run on it. The same evaluation runs
      # here instead, before the pull request exists: an update that breaks a
      # host fails this job and nothing is opened.
      - name: nix flake check
        run: nix flake check --no-build

      - name: statix
        run: nix run --inputs-from . nixpkgs#statix -- check .

      - name: deadnix
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .

      - name: open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update/flake-lock
          # Reuses the same branch every week, so a pending update is amended
          # rather than stacked behind a second pull request.
          delete-branch: true
          title: "chore: update the flake inputs"
          commit-message: "chore: update the flake inputs"
          body: |
            Weekly `nix flake update`.

            `nix flake check --no-build` passed on this lock file before the
            pull request was opened, so every host still evaluates.
