name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flake:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every nixosConfiguration without building it, which is what
      # catches a broken option or a renamed module. Building a full system
      # closure does not fit in a hosted runner.
      - name: nix flake check
        run: nix flake check --no-build

      - name: statix
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail .

      # --ci formats the checkout and fails if anything changed.
      - name: nix fmt
        run: nix fmt -- --ci

      # Build one complete host closure so the configuration is checked beyond
      # evaluation. The test host is representative and does not require real
      # laptop hardware in the runner.
      - name: build nixos-test
        id: build
        run: echo "path=$(nix build .#nixosConfigurations.nixos-test.config.system.build.toplevel --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"

      - name: vulnix
        run: nix run nixpkgs#vulnix -- -C "${{ steps.build.outputs.path }}"
