name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flake:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every nixosConfiguration without building it, which is what
      # catches a broken option or a renamed module. Building a full system
      # closure does not fit in a hosted runner.
      - name: nix flake check
        run: nix flake check --no-build

      # --ci formats the checkout and fails if anything changed.
      - name: nix fmt
        run: nix fmt -- --ci
