name: check

on:
  push:
  pull_request:
  workflow_dispatch:

# Reads the checkout and nothing else.
permissions:
  contents: read

jobs:
  flake:
    name: flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every nixosConfiguration without building it, which is what
      # catches a broken option or a renamed module. Building a full system
      # closure does not fit in a hosted runner.
      - name: nix flake check
        run: nix flake check --no-build

      - name: statix
        run: nix run --inputs-from . nixpkgs#statix -- check .

      - name: deadnix
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .

      # --ci formats the checkout and fails if anything changed.
      - name: nix fmt
        run: nix fmt -- --ci
